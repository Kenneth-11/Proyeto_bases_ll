# --------------------------------------------------------------------------
# postgresql.conf del nodo transaccional (medical_pg).
# Se monta en /etc/postgresql/postgresql.conf y se activa con
#   postgres -c config_file=/etc/postgresql/postgresql.conf
# El directorio de datos sigue siendo PGDATA (/var/lib/postgresql/data).
# --------------------------------------------------------------------------

# -- Conexiones -------------------------------------------------------------
listen_addresses = '*'                  # escucha en la red Docker (medical_net)
port = 5432
max_connections = 120
unix_socket_directories = '/var/run/postgresql'

# -- Autenticacion ----------------------------------------------------------
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = scram-sha-256     # roles nuevos se guardan con SCRAM
authentication_timeout = 30s

# -- Memoria (limite del contenedor: 768 MB) --------------------------------
shared_buffers = 128MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 384MB
dynamic_shared_memory_type = posix

# -- WAL / checkpoints ------------------------------------------------------
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB

# -- Bitacora ---------------------------------------------------------------
log_destination = 'stderr'
log_min_duration_statement = 500        # consultas remotas lentas (FDW) > 500 ms
log_connections = on                    # evidencia de quien se conecta (roles API/FDW)
log_disconnections = on
log_line_prefix = '%m [%p] %u@%d '
log_timezone = 'America/Costa_Rica'

# -- Localizacion -----------------------------------------------------------
timezone = 'America/Costa_Rica'
datestyle = 'iso, dmy'
default_text_search_config = 'pg_catalog.spanish'

# -- Seguridad de sesion por defecto ----------------------------------------
# Los roles de API sobrescriben estos valores con ALTER ROLE ... SET
# (ver sql/postgres/04_roles.sql).
statement_timeout = 0
idle_in_transaction_session_timeout = 0
