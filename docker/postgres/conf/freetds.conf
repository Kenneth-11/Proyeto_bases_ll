# Configuracion de FreeTDS usada por tds_fdw para hablar con SQL Server.
# El nombre de seccion debe coincidir con el host usado en OPTIONS (servername)
# de tds_fdw o con el DNS interno de Docker.

[global]
    tds version = 7.4
    client charset = UTF-8
    text size = 64512
    encryption = off

[mssql]
    host = mssql
    port = 1433
    tds version = 7.4
    client charset = UTF-8
