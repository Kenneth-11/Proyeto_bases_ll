# --------------------------------------------------------------------------
# pg_hba.conf del nodo transaccional (medical_pg).
# Politicas de acceso diferenciadas por rol. PostgreSQL evalua las reglas en
# orden y usa la primera que coincide; la ultima regla rechaza todo lo demas.
#
# "samenet" = cualquier subred de las interfaces del contenedor, es decir la
# red interna de Docker (medical_net).
# --------------------------------------------------------------------------
# TYPE  DATABASE        USER                ADDRESS         METHOD

# Administracion: solo el superusuario por socket local dentro del contenedor
# (docker exec ... psql -U postgres), usado por bootstrap/verify/demo.
local   all             postgres                            trust
local   all             all                                 reject

# Administracion remota del superusuario solo desde la red Docker y con SCRAM.
host    all             postgres            samenet         scram-sha-256

# Perfiles internos del cluster (FDW): solo desde la red interna de Docker,
# solo a la base operativa, con SCRAM.
host    medical_oltp    usr_fdw_pg_mssql    samenet         scram-sha-256
host    medical_oltp    usr_fdw_pg_mongo    samenet         scram-sha-256

# Perfiles externos (aplicaciones): pueden entrar desde fuera del contenedor
# (API web / app movil), solo a la base operativa, con SCRAM.
host    medical_oltp    usr_api_web         0.0.0.0/0       scram-sha-256
host    medical_oltp    usr_api_web         ::/0            scram-sha-256
host    medical_oltp    usr_api_mobile      0.0.0.0/0       scram-sha-256
host    medical_oltp    usr_api_mobile      ::/0            scram-sha-256

# Cualquier otra combinacion usuario/base/origen se rechaza.
host    all             all                 0.0.0.0/0       reject
host    all             all                 ::/0            reject
